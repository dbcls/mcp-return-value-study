# ChEMBL label collision -- FULL deterministic window (CHEMBL4096=TP53,
# ORDER BY ?chemblId LIMIT 200): ALL 124 id-only (answer NONE) + 76 named
# (answer the name). Path A: use the whole window for power. Naturalistic
# rate is 98.4% id-only (35,910/36,494); this balanced-ish 124:76 is the
# deterministic top-200, disclosed as such. Control name regexes are
# first-draft -- byte-audit against real answers.

