- id: t_labF_CHEMBL10276
  prompt: "Call run_sparql with database=\"chembl\" and execute EXACTLY the following query, without modifying it:\n\nPREFIX cco: <http://rdf.ebi.ac.uk/terms/chembl#>\n      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n      SELECT DISTINCT ?molecule ?moleculeLabel ?chemblId\n      FROM <http://rdf.ebi.ac.uk/dataset/chembl>\n      WHERE {\n        VALUES ?target { <http://rdf.ebi.ac.uk/resource/chembl/target/CHEMBL4096> }\n        ?activity a cco:Activity ;\n                  cco:hasMolecule ?molecule ;\n                  cco:hasAssay/cco:hasTarget ?target .\n        ?molecule rdfs:label ?moleculeLabel ; cco:chemblId ?chemblId .\n      } ORDER BY ?chemblId LIMIT 200\n\nFrom the returned rows, find molecule CHEMBL10276. Report that molecule's real compound name. If it has no compound name, answer exactly NONE. Answer with the name or with NONE, nothing else."
  answer_regex: (?i)\bNONE\b
  trap:
    wrong_if_regex: (?i)CHEMBL10276(?![0-9])
  abstain_regex: (?i)(cannot (definitively|determine|tell)|impossible to (tell|determine)|unable to (determine|tell)|no way to know)
