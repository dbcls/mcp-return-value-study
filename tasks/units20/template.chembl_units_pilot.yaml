# Implicit units — ITEM-LEVEL suite, 18 treatment + 12 control.
#
# WHY THIS REPLACES THE 6-ITEM VERSION. Both conditions are measured on the SAME
# compounds, so the manipulation is a paired design and McNemar's exact test is
# the right one. With six treatment items even perfect discordance gives
# two-sided p = 0.0625: that design could not reach significance at any effect
# size, and the pilot duly returned 5 discordant pairs, 0 reversals, p = 0.0625.
# The item count here was fixed by a power calculation BEFORE this run and is
# reported whatever the outcome; it is not the pilot continued until it passed.
# At the pilot's rate (5 of 6 uM items lost), 18 paired items give p < 0.001.
#
# LIMIT is 100, not 30: the 30-row payload holds only six uM rows. The payload
# therefore differs from the pilot's, and the two are not pooled.
#
# CONDITIONS (--conditions units_on,units_off --repeats 1). Format is held at
# native CSV in both; only the unit column varies. THE AMBIGUITY IS NOT ChEMBL'S:
# it returns cco:units, normalizes cco:standardValue to nM, and links QUDT.
# units_off reproduces the many real APIs that return a bare number.
#
# DESIGN. Stripped of units the default reading is nM: wrong for uM rows (1000x),
# accidentally right for nM rows. The prediction is not "units_off is worse" but
# "units_off fails on uM rows and not on nM rows". Compounds appearing twice with
# different values (CHEMBL122812, CHEMBL191881, CHEMBL336228) are excluded: the
# question would be ambiguous. Items are the first 18 uM and first 12 nM rows
# in payload order, no selection on outcome.
#
# GROUND TRUTH is read from the payload the tool returns.

tasks:

  # ---- treatment: uM rows. Reading the bare number as nM is 1000x off ----

  - id: t_u18_CHEMBL2370193
    prompt: >
      Call run_sparql with database="chembl" and execute EXACTLY the following
      query, without modifying it:

      PREFIX cco: <http://rdf.ebi.ac.uk/terms/chembl#>
      SELECT ?chemblId ?value ?units
      FROM <http://rdf.ebi.ac.uk/dataset/chembl>
      WHERE {
        ?activity a cco:Activity ;
                  cco:hasMolecule ?molecule ;
                  cco:hasAssay/cco:hasTarget <http://rdf.ebi.ac.uk/resource/chembl/target/CHEMBL4072> ;
                  cco:standardType "IC50" ;
                  cco:value ?value ;
                  cco:units ?units .
        ?molecule cco:chemblId ?chemblId .
        FILTER(?units IN ("nM", "uM"))
      }
      LIMIT 100

      From the returned rows, report the IC50 of compound CHEMBL2370193 expressed in
      nanomolar (nM). Give the numeric value in nM.
    answer_regex: "(?<![\\d.])(?:9,?500)(?![\\d,])"
    trap:
      wrong_if_regex: "(?i)(?<![\\d.])(?:9\\.5(?:\\.0)?)\\s*(?:nM|nanomolar)"
    abstain_regex: "(?i)(cannot (definitively|determine|tell)|impossible to (tell|determine)|unable to (determine|tell)|if we assume|assumption is unreliable|units column (was |is )?(not returned|missing|absent))"

