# Units experiment -- target CHEMBL3071. Auto-generated by make_units20_tasks.py from post_exclusion20.json.
# DO NOT hand-edit: regenerate from source. Scoring is numeric-only (answer_nM / trap_nM);
# no answer_regex / trap regex. abstain_regex reused from the pilot suite. LIMIT 100 fixed.
# treatment (uM): answer_nM = value*1000, trap_nM = value. control (nM): answer_nM = value, no trap.

tasks:
- id: t_u20_CHEMBL3071_CHEMBL138809
  prompt: |
    Call run_sparql with database="chembl" and execute EXACTLY the following query, without modifying it:
    PREFIX cco: <http://rdf.ebi.ac.uk/terms/chembl#> SELECT ?chemblId ?value ?units FROM <http://rdf.ebi.ac.uk/dataset/chembl> WHERE {
      ?activity a cco:Activity ;
                cco:hasMolecule ?molecule ;
                cco:hasAssay/cco:hasTarget <http://rdf.ebi.ac.uk/resource/chembl/target/CHEMBL3071> ;
                cco:standardType "IC50" ;
                cco:value ?value ;
                cco:units ?units .
      ?molecule cco:chemblId ?chemblId .
      FILTER(?units IN ("nM", "uM"))
    } ORDER BY ?activity LIMIT 100
    From the returned rows, report the IC50 of compound CHEMBL138809 expressed in nanomolar (nM). Give the numeric value in nM.
  answer_nM: !!float '10000'
  trap_nM: !!float '10'
  abstain_regex: (?i)(cannot (definitively|determine|tell)|impossible to (tell|determine)|unable to (determine|tell)|if we assume|assumption is unreliable|units column (was |is )?(not returned|missing|absent))
