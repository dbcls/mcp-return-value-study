tasks:
- id: t_u20_CHEMBL5084_CHEMBL3337846
  prompt: |
    Call run_sparql with database="chembl" and execute EXACTLY the following query, without modifying it:
    PREFIX cco: <http://rdf.ebi.ac.uk/terms/chembl#> SELECT ?chemblId ?value ?units FROM <http://rdf.ebi.ac.uk/dataset/chembl> WHERE {
      ?activity a cco:Activity ;
                cco:hasMolecule ?molecule ;
                cco:hasAssay/cco:hasTarget <http://rdf.ebi.ac.uk/resource/chembl/target/CHEMBL5084> ;
                cco:standardType "IC50" ;
                cco:value ?value ;
                cco:units ?units .
      ?molecule cco:chemblId ?chemblId .
      FILTER(?units IN ("nM", "uM"))
    } ORDER BY ?activity LIMIT 100
    From the returned rows, report the IC50 of compound CHEMBL3337846 expressed in nanomolar (nM). Give the numeric value in nM.
  answer_nM: !!float '800'
  trap_nM: 0.8
  abstain_regex: (?i)(cannot (definitively|determine|tell)|impossible to (tell|determine)|unable to (determine|tell)|if we assume|assumption is unreliable|units column (was |is )?(not returned|missing|absent))
